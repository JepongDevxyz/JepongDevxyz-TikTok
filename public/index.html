<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikXedd Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-cyan-500 to-pink-500 p-2 rounded-xl text-white">
                    <i class="fa-brands fa-tiktok text-xl"></i>
                </div>
                <h1 class="font-bold text-xl tracking-wide bg-gradient-to-r from-cyan-400 to-pink-500 bg-clip-text text-transparent">
                    TikXedd Downloader
                </h1>
            </div>
            <span class="text-xs font-mono bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">v3.0.0</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
        
        <!-- URL Downloader Card (Centered Text and Inputs) -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4 text-center">
            <label class="block text-sm font-medium text-slate-300 text-center">TikTok Video or Photo Link</label>
            <div class="flex flex-col gap-3">
                <input type="text" id="resolve-url" placeholder="https://vt.tiktok.com/xxxxxx/" 
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-center focus:outline-none focus:border-cyan-500 transition">
                <button onclick="handleResolve()" id="resolve-btn" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:opacity-90 font-semibold px-6 py-3 rounded-xl text-sm transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i> Get Media
                </button>
            </div>
        </div>

        <!-- Download Result Card -->
        <div id="resolve-result" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6">
            <div class="flex flex-col gap-6 items-center">
                
                <!-- Media Preview -->
                <div class="w-full aspect-[9/16] bg-slate-950 rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center relative max-w-xs">
                    <video id="res-video" controls class="w-full h-full object-cover hidden"></video>
                    <img id="res-image" class="w-full h-full object-cover hidden" alt="Preview">
                    <div id="res-media-placeholder" class="text-slate-600 text-center p-4">
                        <i class="fa-solid fa-photo-film text-4xl mb-2 block"></i>
                        <p class="text-xs">Preview unavailable</p>
                    </div>
                </div>

                <!-- Profile & Downloads -->
                <div class="w-full space-y-4 text-center">
                    <div class="flex items-center justify-center gap-3">
                        <img id="res-avatar" class="w-10 h-10 rounded-full border border-slate-700 hidden" alt="Avatar">
                        <div>
                            <span id="res-author" class="text-xs font-semibold text-cyan-400 bg-cyan-950/50 border border-cyan-800/50 px-2.5 py-1 rounded-md"></span>
                            <span id="res-handle" class="text-xs text-slate-400 block mt-1"></span>
                        </div>
                    </div>

                    <p id="res-desc" class="text-slate-200 text-sm leading-relaxed"></p>

                    <!-- Download Options -->
                    <div class="space-y-2 pt-2">
                        <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider text-center">Download Options</h4>
                        <div class="flex flex-col gap-2" id="res-downloads"></div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-900/30 py-4 text-center text-xs text-slate-500">
        Engineered by <span class="text-slate-300 font-semibold">JepongDevxyz</span> &copy; 2026
    </footer>

    <!-- Logic -->
    <script>
        async function triggerDirectDownload(url, filename, btnElement) {
            const originalHTML = btnElement.innerHTML;
            btnElement.disabled = true;
            btnElement.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Downloading...`;

            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const tempAnchor = document.createElement('a');
                tempAnchor.href = blobUrl;
                tempAnchor.download = filename;
                document.body.appendChild(tempAnchor);
                tempAnchor.click();
                
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(tempAnchor);
            } catch (err) {
                window.open(url, '_blank');
            } finally {
                btnElement.disabled = false;
                btnElement.innerHTML = originalHTML;
            }
        }

        async function handleResolve() {
            const urlInput = document.getElementById('resolve-url').value.trim();
            if (!urlInput) return alert('Please enter a valid TikTok URL');

            const btn = document.getElementById('resolve-btn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Processing...`;

            try {
                const res = await fetch(`/api/resolve?url=${encodeURIComponent(urlInput)}`);
                const responseData = await res.json();

                if (!res.ok || responseData.ok === false) {
                    throw new Error(responseData.error || 'Failed to download media.');
                }

                document.getElementById('resolve-result').classList.remove('hidden');
                const item = responseData.item || responseData;

                document.getElementById('res-author').textContent = item.author?.nickname || item.author?.name || 'TikTok User';
                document.getElementById('res-handle').textContent = item.author?.unique_id ? `@${item.author.unique_id}` : '';

                if (item.author?.avatar) {
                    const avatarImg = document.getElementById('res-avatar');
                    avatarImg.src = item.author.avatar;
                    avatarImg.classList.remove('hidden');
                }

                document.getElementById('res-desc').textContent = item.title || item.desc || 'No description';

                const videoEl = document.getElementById('res-video');
                const imageEl = document.getElementById('res-image');
                const placeholderEl = document.getElementById('res-media-placeholder');
                const dlContainer = document.getElementById('res-downloads');

                dlContainer.innerHTML = '';
                videoEl.classList.add('hidden');
                imageEl.classList.add('hidden');
                placeholderEl.classList.remove('hidden');

                const hdVideo = item.video?.hd || item.play || item.wmplay;
                if (hdVideo) {
                    videoEl.src = hdVideo;
                    videoEl.classList.remove('hidden');
                    placeholderEl.classList.add('hidden');

                    const b = document.createElement('button');
                    b.className = "w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:opacity-90 text-white text-xs font-bold py-3 rounded-xl flex items-center justify-center gap-2";
                    b.innerHTML = `<i class="fa-solid fa-download"></i> Download No Watermark Video`;
                    b.onclick = () => triggerDirectDownload(hdVideo, `tikxedd_video_${Date.now()}.mp4`, b);
                    dlContainer.appendChild(b);
                }

                const images = item.images || [];
                if (images.length > 0) {
                    imageEl.src = images[0];
                    imageEl.classList.remove('hidden');
                    videoEl.classList.add('hidden');
                    placeholderEl.classList.add('hidden');

                    images.forEach((img, i) => {
                        const b = document.createElement('button');
                        b.className = "w-full bg-pink-600 hover:bg-pink-500 text-white text-xs font-semibold py-2.5 rounded-xl flex items-center justify-center gap-2";
                        b.innerHTML = `<i class="fa-solid fa-image"></i> Download Photo ${i + 1}`;
                        b.onclick = () => triggerDirectDownload(img, `tikxedd_photo_${i + 1}.jpg`, b);
                        dlContainer.appendChild(b);
                    });
                }

                if (item.music) {
                    const musicUrl = item.music_info?.play || item.music;
                    if (typeof musicUrl === 'string') {
                        const b = document.createElement('button');
                        b.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2.5 rounded-xl flex items-center justify-center gap-2";
                        b.innerHTML = `<i class="fa-solid fa-music"></i> Download Audio Track (MP3)`;
                        b.onclick = () => triggerDirectDownload(musicUrl, `tikxedd_audio_${Date.now()}.mp3`, b);
                        dlContainer.appendChild(b);
                    }
                }

            } catch (err) {
                alert(`Error: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-download"></i> Get Media`;
            }
        }
    </script>
</body>
</html>
